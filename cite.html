<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>References</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon.png">
<style>
  /* A page a LibLande QR code opens: the references it carries, in the
     link itself (nothing is stored anywhere), with Copy and their DOIs. */
  :root { --bg: #ffffff; --panel: #f7f9f8; --text: #1b2321; --muted: #5d6a66; --line: #d8dfdc; --accent: #1f6b5c; --accent-ink: #ffffff; --accent-soft: #dcebe6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161b1a; --panel: #1d2423; --text: #e6ece9; --muted: #9aa6a2; --line: #2e3836; --accent: #6fbfa8; --accent-ink: #10201b; --accent-soft: #23423a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; font-weight: 600; line-height: 1.3; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  li { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .ref { font: 16px/1.55 "Iowan Old Style", Georgia, serif; padding-left: 1.5em; text-indent: -1.5em; overflow-wrap: anywhere; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .all { margin: 0 0 16px; }
  .msg { color: var(--muted); }
  .done { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .done.show { opacity: 1; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12.5px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1 id="head">References</h1>
  <p class="sub" id="sub"></p>
  <div id="all"></div>
  <ol id="list"><li class="msg">Reading the references&hellip;</li></ol>
  <footer>Shared from <a href="./">LibLande</a>.</footer>
</main>
<div class="done" id="done" role="status"></div>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  // (A reference comes as HTML, its text escaped, with italics: any other
  // tag is shown as text, not made.)
  const safe = h => String(h).replace(/<(?!\/?i>)/g, '&lt;');
  const plain = h => { const d = document.createElement('div'); d.innerHTML = safe(h); return d.textContent; };
  const say = t => { const d = $('done'); d.textContent = t; d.classList.add('show'); clearTimeout(say.t); say.t = setTimeout(() => d.classList.remove('show'), 1800); };
  async function copy(html, text) {
    try {
      if (window.ClipboardItem) await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]);
      else await navigator.clipboard.writeText(text);
      say('Copied');
    } catch (e) {
      try { await navigator.clipboard.writeText(text); say('Copied'); } catch (e2) { say('Couldn’t copy: select the text instead'); }
    }
  }
  let refs;
  try {
    // The link's #r=: the references, as JSON, deflated, in base64url.
    const b64 = (location.hash.match(/[#&]r=([A-Za-z0-9_-]+)/) || [])[1];
    if (!b64) throw new Error('none');
    const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((b64.length + 3) % 4));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    const json = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    refs = JSON.parse(json);
    if (!Array.isArray(refs) || !refs.length) throw new Error('empty');
  } catch (e) {
    $('list').innerHTML = '<li class="msg">This link doesn’t carry any references (it may have been cut short). Scan the QR code again.</li>';
    return;
  }
  const n = refs.length;
  document.title = n === 1 ? plain(refs[0][0]).slice(0, 80) : n + ' references';
  $('head').textContent = n === 1 ? 'Reference' : n + ' references';
  $('sub').textContent = 'APA (7th ed.)';
  if (n > 1) {
    $('all').innerHTML = '<div class="all"><button type="button" class="btn primary" id="copyAll">Copy all ' + n + '</button></div>';
    $('copyAll').onclick = () => copy(refs.map(r => '<p style="margin:0 0 0 0.5in;text-indent:-0.5in">' + safe(r[0]) + '</p>').join(''), refs.map(r => plain(r[0])).join('\n\n'));
  }
  $('list').innerHTML = refs.map((r, i) => '<li><div class="ref">' + safe(r[0]) + '</div><div class="acts">' +
    '<button type="button" class="btn' + (n === 1 ? ' primary' : '') + '" data-i="' + i + '">Copy</button>' +
    (r[1] ? '<a class="btn" href="https://doi.org/' + esc(r[1]) + '" target="_blank" rel="noopener">Open (DOI)</a>' : /^https?:\/\//.test(r[2] || '') ? '<a class="btn" href="' + esc(r[2]) + '" target="_blank" rel="noopener">Open</a>' : '') +
    '</div></li>').join('');
  $('list').addEventListener('click', ev => {
    const b = ev.target.closest('[data-i]');
    if (b) { const r = refs[+b.dataset.i]; copy(safe(r[0]), plain(r[0])); }
  });
})();
</script>
</body>
</html>
