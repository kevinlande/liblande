<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LibLande: sign in</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.45 -apple-system, system-ui, sans-serif; margin: 24px; background: Canvas; color: CanvasText; }
</style>
<p id="say">Opening Google&#x2019;s sign-in&#x2026;</p>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script>
// (Published from here to the kevinlande/liblande-word repository, at
// kevinlande.github.io/liblande-word/signin.html: see its README.)
// Opened by test.html in Word's own sign-in window (Office's dialog). First
// it goes to Google's sign-in; Google sends it back here with a token (or
// an error) after the #, which is handed to the panel (messageParent).
(() => {
  const CLIENT_ID = '789682218462-98mjugngb46ttd01ucp9dcj71ufspjgn.apps.googleusercontent.com';
  const SCOPE = 'https://www.googleapis.com/auth/drive';
  const here = location.origin + location.pathname;
  const back = new URLSearchParams(location.hash.slice(1));
  const said = new URLSearchParams(location.search);
  const send = msg => Office.onReady(() => Office.context.ui.messageParent(JSON.stringify(msg)));
  if (back.get('access_token')) {
    document.getElementById('say').textContent = 'Signed in. Going back to Word…';
    send({ token: back.get('access_token') });
  } else if (back.get('error') || said.get('error')) {
    document.getElementById('say').textContent = 'Google said: ' + (back.get('error') || said.get('error'));
    send({ error: back.get('error') || said.get('error') });
  } else {
    const q = new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: here, response_type: 'token', scope: SCOPE, prompt: 'select_account', include_granted_scopes: 'true' });
    location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + q;
  }
})();
</script>
