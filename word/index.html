<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LibLande</title>
<style>
  :root { --bg:#fff; --panel:#f6f8f7; --text:#1b2321; --muted:#56635f; --faint:#66726e; --line:#d5ddd9; --row:#eef2f0; --accent:#1f6b5c; --accent-ink:#fff; --soft:#dcebe6; --warn:#8a4b00; --warn-soft:#fbefdc; --field:#fff; --focus:#2a7de1; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f2322; --panel:#262b2a; --text:#e2e8e5; --muted:#a9b5b1; --faint:#95a29e; --line:#3a4341; --row:#2c3331; --accent:#5fb39e; --accent-ink:#0f1a17; --soft:#24433b; --warn:#f0b866; --warn-soft:#3b2e1a; --field:#191d1c; --focus:#6aa8ff; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  [hidden] { display: none !important; }
  /* (Room at the right for the "i" Word puts over a panel's top corner.) */
  .ph { display: flex; align-items: center; gap: 8px; padding: 10px 44px 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); position: relative; flex: none; }
  .ph b { font-size: 14px; }
  .logo { border-radius: 5px; flex: none; }
  .hbtn { margin-left: auto; width: 28px; height: 28px; border: none; background: none; border-radius: 7px; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
  .hbtn:hover { background: var(--row); }
  .hbtn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .hbtn.busy svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pill { margin-left: auto; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); }
  .acct { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; border: none; background: var(--soft); color: var(--accent); font-weight: 600; font-size: 12px; cursor: pointer; }
  .pill:not([hidden]) + .hbtn, .hbtn + .acct { margin-left: 4px; }
  .menu { position: absolute; right: 10px; top: 42px; min-width: 210px; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 8px 24px #0004; padding: 6px 0; z-index: 5; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 6px 12px; cursor: pointer; }
  .menu button:hover { background: var(--row); }
  .menu .who { color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); padding: 2px 12px 8px; margin-bottom: 4px; }
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); flex: none; }
  .tabs button { background: none; border: none; padding: 6px 10px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button[aria-selected="true"] { color: var(--accent); font-weight: 600; border-bottom-color: var(--accent); }
  .view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .body { padding: 12px; }
  .search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--field); border-radius: 8px; padding: 0 9px; }
  .search:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent); }
  .search svg { width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
  .search input { flex: 1; border: none; background: none; padding: 7px 0; font: inherit; color: var(--text); outline: none; min-width: 0; }
  .res { margin: 8px -12px 0; }
  .sub { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); padding: 6px 12px 2px; }
  .it { display: flex; gap: 9px; padding: 8px 12px; border-bottom: 1px solid var(--row); cursor: pointer; }
  .it:hover { background: color-mix(in srgb, var(--soft) 45%, transparent); }
  .it[aria-checked="true"] { background: var(--soft); }
  .it.kb { box-shadow: inset 3px 0 0 var(--focus); }
  .box { width: 16px; height: 16px; border: 1.5px solid var(--faint); border-radius: 4px; flex: none; margin-top: 2px; display: grid; place-items: center; color: var(--accent-ink); font-size: 11px; }
  .it[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
  .it .tx { flex: 1; min-width: 0; }
  .t { font-weight: 600; }
  .m { color: var(--muted); font-size: 12px; }
  .cited { align-self: flex-start; margin-top: 2px; font-size: 11px; line-height: 16px; color: var(--accent); background: var(--bg); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 9px; padding: 0 7px; white-space: nowrap; flex: none; }
  .empty { text-align: center; color: var(--muted); padding: 22px 8px; }
  .empty .btn { margin-top: 10px; }
  /* The Cite tab: the search and the two lists on top, the citation's card
     at the foot (three sizes: 1 its bar and buttons, 2 a few works, 3 up to
     the search box). */
  .top { padding: 12px 12px 0; flex: none; }
  .subtabs { display: flex; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .subtabs button { flex: 1; padding: 5px 6px; font-size: 12px; color: var(--muted); background: var(--field); border: none; cursor: pointer; }
  .subtabs button + button { border-left: 1px solid var(--line); }
  .subtabs button[aria-selected="true"] { background: var(--soft); color: var(--accent); font-weight: 600; }
  .subtabs i { font-style: normal; opacity: .7; font-weight: 400; margin-left: 4px; }
  .sortrow { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--faint); padding: 6px 0 2px; }
  .sortrow select { font: inherit; font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; }
  #resBox .res { margin: 2px 0 0; }
  .other { padding: 10px 12px; color: var(--muted); font-size: 12px; }
  .other button { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0 0 0 4px; }
  #pCite.editing:not(.searching):not(.browsing) .lists { opacity: .5; cursor: pointer; }
  .lists { transition: opacity .15s; }
  .foot { margin: 0 8px 8px; border: 2px solid var(--accent); border-radius: 12px; box-shadow: 0 -6px 18px #0002; background: color-mix(in srgb, var(--accent) 6%, var(--bg)); padding: 0 12px 12px; overflow: hidden; flex: none; display: flex; flex-direction: column; max-height: calc(100% - 16px); }
  .handle { display: flex; justify-content: center; padding: 5px 0 3px; background: var(--accent); margin: 0 -12px; border: none; cursor: ns-resize; touch-action: none; flex: none; }
  .handle span { width: 34px; height: 4px; border-radius: 2px; background: var(--accent-ink); opacity: .6; }
  .gbar { background: var(--accent); color: var(--accent-ink); margin: 0 -12px 10px; padding: 0 6px 9px 12px; cursor: pointer; flex: none; }
  .gtop { display: flex; align-items: center; gap: 2px; }
  .gk { flex: 1; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; opacity: .85; }
  .gbar .ic { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; border: none; background: none; color: inherit; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; }
  .gbar .ic:hover { background: rgba(0,0,0,.15); }
  .gc { font: 14px/1.35 Garamond, "EB Garamond", Georgia, serif; margin-top: 1px; padding-right: 6px; overflow-wrap: anywhere; }
  .galso { font-size: 11.5px; opacity: .85; margin-top: 4px; }
  .cbody { display: flex; flex-direction: column; min-height: 0; }
  .foot[data-size="1"] .cbody { display: none; }
  .foot[data-size="2"] .chosen { max-height: 190px; }
  .foot[data-size="3"] { flex: 1; }
  .foot[data-size="3"] .cbody { flex: 1; }
  #pCite.full .lists { display: none; }
  .chosen { overflow-y: auto; min-height: 0; padding: 4px 6px; margin: -4px -6px 6px; }
  .ch { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px 7px 2px; display: grid; grid-template-columns: 16px 1fr 24px; column-gap: 6px; row-gap: 5px; align-items: center; }
  .ch .grip { grid-row: 1 / span 2; }
  .ch .nm { grid-column: 2; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
  .ch .x { grid-column: 3; grid-row: 1; }
  .ch .fl { grid-column: 2; display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--faint); flex-wrap: wrap; }
  .ch .fl label { display: flex; align-items: center; gap: 4px; }
  .ch input { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--field); color: var(--text); border-radius: 5px; padding: 2px 5px; width: 82px; }
  .ch input.pg { width: 70px; }
  .order { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .order button { font-size: 12px; padding: 4px 7px; background: var(--field); border: none; color: var(--accent); cursor: pointer; }
  .order button + button { border-left: 1px solid var(--line); }
  .order button[aria-pressed="true"] { background: var(--soft); font-weight: 600; }
  .foot .btns { flex: none; }
  .chosen { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .ch.drag { box-shadow: 0 6px 16px #0004; border-color: var(--accent); position: relative; z-index: 2; cursor: grabbing; }
  .ch.drag .grip { cursor: grabbing; }
  .grip { color: var(--faint); cursor: grab; width: 16px; text-align: center; letter-spacing: -2px; font-size: 12px; user-select: none; touch-action: none; }
  .ch input::placeholder { color: var(--faint); }
  .x { width: 24px; height: 24px; border: none; background: none; color: var(--muted); border-radius: 5px; cursor: pointer; flex: none; }
  .x:hover { background: var(--row); }
  .opts { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { padding: 4px 7px; font-size: 12px; background: var(--field); border: none; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
  .note { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .btns { display: flex; gap: 8px; }
  .btn { border: 1px solid var(--line); background: var(--field); border-radius: 8px; padding: 7px 12px; font-weight: 500; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.grow { flex: 1; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn kbd { font: 11px -apple-system, system-ui; opacity: .75; margin-left: 6px; }
  .card { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-bottom: 10px; }
  .card h4 { margin: 0 0 6px; font-size: 13px; }
  .line { display: flex; align-items: center; gap: 8px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
  .line b { color: var(--text); font-weight: 500; }
  .line select { margin-left: auto; font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }
  .link-row { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid var(--row); font-size: 12px; align-items: center; }
  .link-row .w { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--soft); color: var(--accent); white-space: nowrap; }
  .tag.w { background: var(--warn-soft); color: var(--warn); }
  .mini { border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 12px; background: var(--field); cursor: pointer; flex: none; }
  .link-row { cursor: pointer; }
  .pick { border: 1px solid var(--accent); border-radius: 8px; padding: 6px; margin: 2px 0 8px; background: var(--field); }
  .pk { display: flex; gap: 8px; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--row); padding: 6px 4px; cursor: pointer; font-size: 12px; }
  .pk:hover { background: var(--row); }
  .radio { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; margin-top: 1px; }
  .pk[aria-pressed="true"] .radio { border: 4px solid var(--accent); }
  .pick .search { margin-top: 6px; }
  .pk .t, .pk .m { display: block; }
  .link-row .tag { flex: none; }
  .ask { border: 1px solid var(--line); border-radius: 9px; padding: 10px; background: var(--panel); margin-top: 8px; }
  .ask p { margin: 0 0 8px; font-weight: 500; }
  .subtabs { overflow-x: auto; scrollbar-width: none; }
  .subtabs button { white-space: nowrap; }
  .subtabs .gx { margin-left: 6px; opacity: .7; font-weight: 400; }
  .subtabs .gx:hover { opacity: 1; }
  .subtabs .add { flex: none; width: 30px; font-size: 15px; line-height: 1; color: var(--accent); }
  .gmenu { position: fixed; left: 12px; right: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px #0005; padding: 8px; z-index: 6; max-height: 70vh; overflow-y: auto; }
  .gmenu .search { margin-bottom: 6px; }
  .gmenu .g { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 6px; width: 100%; text-align: left; background: none; border: none; cursor: pointer; }
  .gmenu .g:hover { background: var(--row); }
  .gmenu .g .n { flex: 1; }
  .gmenu .g .c { color: var(--faint); font-size: 12px; }
  .gico { width: 14px; color: var(--muted); }
  .gsep { border-top: 1px solid var(--line); margin: 6px 0; }
  .gact { color: var(--accent); padding: 6px; background: none; border: none; cursor: pointer; text-align: left; width: 100%; }
  #gNew input { width: 100%; font: inherit; border: 1px solid var(--line); background: var(--field); color: var(--text); border-radius: 6px; padding: 6px 8px; margin: 4px 0 8px; }
  #gNew .err { margin: 0 0 8px; }
  .sortrow .only { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .nw { padding: 9px 12px; border-bottom: 1px solid var(--row); cursor: pointer; }
  .nw:hover { background: color-mix(in srgb, var(--soft) 45%, transparent); }
  .nw .cnts { display: flex; gap: 6px; margin-top: 4px; align-items: center; }
  .chip { font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--row); color: var(--muted); }
  .nw .cited { margin-left: auto; }
  /* (Back to the list: a bar that stays at the top while the notes scroll.) */
  .backbar { position: sticky; top: -12px; z-index: 2; margin: -12px -12px 10px; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-size: 13px; font-weight: 600; background: var(--soft); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 8px; cursor: pointer; padding: 5px 12px 5px 9px; }
  .back:hover { background: color-mix(in srgb, var(--accent) 22%, var(--bg)); }
  .back svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .nhead .t { font-size: 14px; }
  .nhead .m { margin: 2px 0 6px; }
  .nsec { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); margin: 14px 0 6px; display: flex; align-items: center; }
  .nsec button { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--accent); background: none; border: none; cursor: pointer; font-size: 12px; }
  .mynote { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; overflow-wrap: anywhere; }
  .mynote h3, .mynote h4 { margin: 4px 0; font-size: 13px; }
  .mynote p, .mynote ul, .mynote ol, .mynote blockquote { margin: 0 0 6px; }
  .mynote ul, .mynote ol { padding-left: 18px; }
  .mynote blockquote { border-left: 3px solid var(--line); padding-left: 8px; color: var(--muted); }
  .pgh { font-size: 11px; color: var(--faint); margin: 10px 0 0; }
  .hlt { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--row); }
  .hlt .bar { width: 4px; border-radius: 2px; flex: none; background: var(--line); }
  .hlt .q { flex: 1; min-width: 0; font: 13.5px/1.4 Garamond, "EB Garamond", Georgia, serif; overflow-wrap: anywhere; }
  .hlt .q .note2 { display: block; font: 12px/1.4 -apple-system, system-ui, sans-serif; color: var(--muted); margin-top: 3px; }
  .hlt .qb { align-self: flex-start; font-size: 11.5px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; background: var(--field); color: var(--accent); white-space: nowrap; cursor: pointer; }
  .selcard { border: 2px solid var(--accent); border-radius: 12px; background: color-mix(in srgb, var(--accent) 6%, var(--bg)); margin: 0 0 10px; overflow: hidden; max-height: 55vh; overflow-y: auto; }
  .selcard .sb { background: var(--accent); color: var(--accent-ink); padding: 4px 6px 8px 12px; position: sticky; top: 0; }
  .selcard .sb .ic { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; border: none; background: none; color: inherit; cursor: pointer; font-size: 13px; }
  .selcard .sb .ic:hover { background: rgba(0,0,0,.15); }
  .sbd { padding: 6px 12px 12px; }
  .sbd .note { margin: 4px 0; }
  .lbl2 { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 2px; }
  .cand { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--row); align-items: flex-start; }
  .cand .tx { flex: 1; min-width: 0; }
  .cand .lk { border: 1px solid var(--accent); color: var(--accent); background: var(--field); border-radius: 6px; padding: 2px 9px; font-size: 12px; white-space: nowrap; cursor: pointer; }
  .cand .lk.p { background: var(--accent); color: var(--accent-ink); }
  .sbd .alt { display: flex; gap: 8px; margin-top: 8px; }
  .sbd .alt button { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 6px; font-size: 12px; background: var(--field); cursor: pointer; }
  .sbd .alt button.go { color: var(--accent); border-color: var(--accent); }
  .sbd .alt button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
  .sbd .alt button:disabled { opacity: .5; cursor: default; }
  .sbd .search { margin-top: 6px; }
  .err.ok { background: var(--soft); color: var(--accent); }
  .err { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; }
</style>

<header class="ph">
  <img class="logo" src="icons/icon-32.png" alt="" width="20" height="20"><b>LibLande</b>
  <span class="pill" id="offline" hidden>Offline</span>
  <button class="hbtn" id="refresh" type="button" title="Refresh library and citations" aria-label="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
  <button class="acct" id="acct" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Account" hidden>?</button>
  <div class="menu" id="menu" role="menu" hidden>
    <div class="who" id="menuWho"></div>
    <button type="button" role="menuitem" id="mReload">Reload library</button>
    <button type="button" role="menuitem" id="mOpen">Open LibLande</button>
    <button type="button" role="menuitem" id="mOut">Sign out</button>
  </div>
</header>

<div class="view" id="vSignin" hidden>
  <div class="body"><div class="empty">Sign in to Google to use your library.<br><button class="btn primary" id="signin" type="button">Sign in</button><div class="note" id="signinNote" style="margin-top:10px"></div></div></div>
</div>

<div class="view" id="vMain" hidden>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tCite" aria-selected="true" aria-controls="pCite">Cite</button>
    <button type="button" role="tab" id="tRefs" aria-selected="false" aria-controls="pRefs">References</button>
    <button type="button" role="tab" id="tNotes" aria-selected="false" aria-controls="pNotes">Notes</button>
  </div>
  <div class="view" id="pCite" role="tabpanel">
    <div class="top">
      <div class="selcard" id="selCard" hidden>
        <div class="sb"><div class="gtop"><span class="gk" id="selLabel"></span><button class="ic" type="button" id="selX" aria-label="Close" title="Close">&#x2715;</button></div><div class="gc" id="selText"></div></div>
        <div class="sbd" id="selBody"></div>
      </div>
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input id="q" type="search" placeholder="Search your library" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search your library" aria-controls="res"></label>
      <div class="lists" id="listsBox">
        <div class="subtabs" role="tablist" aria-label="List" id="lists"><button type="button" role="tab" data-list="doc" aria-selected="false">In this document<i id="nDoc"></i></button><button type="button" role="tab" data-list="lib" aria-selected="true">Library<i id="nLib"></i></button></div>
        <div class="sortrow"><span></span><label>Sort <select id="sort" aria-label="Sort"><option value="author">Author</option><option value="year">Year</option><option value="added">Date added</option></select></label></div>
      </div>
    </div>
    <div class="scroll lists" id="resBox">
